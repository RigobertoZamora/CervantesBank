services:
  postgres_db:
    image: postgres:16-alpine
    container_name: wallet_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wallet_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wallet_secret}
      POSTGRES_DB: ${POSTGRES_DB:-digital_wallet}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wallet_admin} -d ${POSTGRES_DB:-digital_wallet}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wallet_network

  mongo_db:
    image: mongo:7.0-jammy
    container_name: wallet_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-wallet_admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-wallet_secret}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-digital_wallet_docs}
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wallet_network

  redis_cache:
    image: redis:7.2-alpine
    container_name: wallet_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_secret}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wallet_network

  api_core:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wallet_api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      POSTGRES_HOST: postgres_db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-wallet_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wallet_secret}
      POSTGRES_DB: ${POSTGRES_DB:-digital_wallet}
      MONGO_URI: mongodb://${MONGO_USER:-wallet_admin}:${MONGO_PASSWORD:-wallet_secret}@mongo_db:27017/${MONGO_DB:-digital_wallet_docs}?authSource=admin
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis_cache:6379
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      postgres_db:
        condition: service_healthy
      mongo_db:
        condition: service_healthy
      redis_cache:
        condition: service_healthy
    networks:
      - wallet_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wallet_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:3000/api
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api_core
    networks:
      - wallet_network

volumes:
  postgres_data:
  mongo_data:
  redis_data:

networks:
  wallet_network:
    driver: bridge